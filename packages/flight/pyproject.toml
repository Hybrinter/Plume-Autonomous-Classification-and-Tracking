[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-flight"
version = "0.1.0"
description = "PACT flight software (lean flight image)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "structlog>=23.0",
]

[project.optional-dependencies]
# Role extras (contents filled when a stack is chosen; empty for now).
# inference = onboard model runtime; camera / gimbal = pip-installable device libs only.
inference = []
camera = []
gimbal = []

[tool.hatch.build.targets.wheel]
packages = ["src/flight"]
