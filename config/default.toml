# PACT default configuration
# All tunable parameters for every subsystem live here.
# No magic numbers in source code — every threshold must reference this file.
# Loaded once at startup by ops/config_loader.py into typed PactConfig dataclasses.

[controller]
confidence_gate = 0.55
release_persistence_frames = 5
blob_iou_match_threshold = 0.25
min_blob_area_px = 15
limb_arrival_deg = 0.5
dt_inner_s = 0.001
rate_fit_n = 7
rate_fit_degree = 2
kp = 200.0
ki = 10000.0
tau_cl_s = 0.010
dt_outer_s = 0.020
Kp = 8.0
Q_diag = [1.0e-11, 3.0e-8]
R_v = 2.12e-9
P0_diag = [1.0e-3, 1.2e-5]
rewind_horizon_s = 0.10
rewind_snapshots = 8
vision_queue_depth = 4
K_pos = 4.0
r_max_stow_deg_per_s = 8.0

[inference]
segmentor_model_path = "data/models/active_segmentor.onnx"
classifier_model_path = "data/models/active_classifier.onnx"
segmentor_rollback_model_path = "data/models/rollback_segmentor.onnx"
classifier_rollback_model_path = "data/models/rollback_classifier.onnx"
classifier_logit_threshold = 0.0
input_bands = ["BLUE", "GREEN", "RED", "NIR"]
input_height_px = 1024
input_width_px = 1224
use_int8 = false
# Derived expected detect wall (Orin Nano Super, mixed knee: cls FP16 + seg INT8).
latency_budget_ms = 4.0

[comms]
max_downlink_rate_bps = 5000000
max_uplink_rate_bps = 2000000
max_daily_downlink_bytes = 1073741824   # 1 GB
max_daily_uplink_bytes = 104857600      # 100 MB
comm_window_days = ["MON", "TUE", "WED", "THU", "FRI"]
ccsds_apid = 1
staged_segmentor_model_path = "data/models/staged_segmentor.onnx"
staged_classifier_model_path = "data/models/staged_classifier.onnx"
downlink_max_bytes_per_pass = 1048576

[storage]
data_root = "data/flight"
max_storage_bytes = 107374182400   # 100 GB placeholder
checksum_algorithm = "sha256"

[preprocessing]
saturation_fraction_threshold = 0.05
nir_red_ratio_threshold = 3.0
sunglint_nir_mean_threshold = 0.6
max_motion_smear_px = 1.0

[sensor]
# BFS-U3-50S5M-C, Sony IMX264, global shutter. width is lateral; height is along-track.
part_number = "BFS-U3-50S5M-C"
sensor_name = "Sony IMX264"
width_px = 2448
height_px = 2048
bit_depth = 12
mosaic_layout = ["BLUE", "GREEN", "RED", "NIR"]
pixel_um = 3.45
focal_length_mm = 150.0
f_number = 4.0
lens_distortion_pct = 0.66
ifov_mosaic_deg_per_px = 0.001318
ifov_band_deg_per_px = 0.002636
fov_lateral_deg = 3.204
fov_along_deg = 2.681
datasheet_hfov_2_3_deg = 3.36
qe_530_pct = 62.51
saturation_capacity_e = 10824.0
temporal_dark_noise_e = 2.27
dynamic_range_db = 71.83
max_frame_rate_hz = 35.0
exposure_min_us = 13.0
exposure_max_us = 30000000.0
initial_exposure_us = 13.0
gain_min_db = 0.0
gain_max_db = 47.0
initial_gain_db = 0.0
calibration_dir = ""

[fault]
watchdog_interval_s = 5.0
watchdog_max_miss_count = 3
# Derived FDIR detect timeout (5x expected, Orin Nano Super mixed knee).
inference_timeout_ms = 20.0
# Payload-bus FDIR allocation. Orin Nano Super module TDP is 25 W; this is not module TDP.
power_limit_w = 55.0

[thermal]
# Record-only datasheet limits. Housekeeping does not compare until per-component sensors exist.
camera_min_c = 0.0
camera_max_c = 50.0
lens_min_c = -10.0
lens_max_c = 50.0
gimbal_min_c = -20.0
gimbal_max_c = 70.0
compute_min_c = 0.0
compute_max_c = 80.0

[gimbal]
# Elevation is signed off-nadir, deg: 0 = geocentric nadir, + along-track (velocity), - look-back.
el_hw_min_deg = -45.0
el_hw_max_deg = 90.0
# Science stop at +45 deg off-nadir: along-track band GSD ~45 m at that look on the
# design pass (~20 m at nadir, ~118 m at 60 deg). Geometric Earth limb is ~69 deg
# off-nadir and is not the detection limit.
el_science_min_deg = 0.0
el_science_max_deg = 45.0
max_hw_slew_rate_deg_per_s = 10.0
stow_el_deg = -45.0
home_el_deg = 45.0
J_kg_m2 = 0.008
B_nms_per_rad = 0.04
tau_max_nm = 1.0
encoder_counts_per_rev = 262144
sim_encoder_noise_deg = 0.005
sim_seed = 0

[ephemeris]
# Circular Keplerian ECI stand-in (ISS GP TLE 25544 mean elements, epoch 2026-09-01).
inclination_deg = 51.6312
mean_motion_rev_per_day = 15.48958602
mu_m3_s2 = 3.986004418e14
omega_earth_rad_s = 7.2921159e-5
wgs84_a_m = 6378137.0
wgs84_f = 0.0033528106647474805
epoch_utc_s = 1788249600.0

[link]
command_tcp_host = "127.0.0.1"
command_tcp_port = 50501
telemetry_udp_host = "127.0.0.1"
telemetry_udp_port = 50502
socket_timeout_s = 1.0
tc_apid = 1
tm_apid = 2

[command_ingress]
hmac_key_path = "data/keys/uplink_hmac.key"
require_auth = true
accepted_sources = ["ground", "station_ops"]

[command_router]
arm_window_s = 30.0

[environment]
sensor = "real"
gimbal = "real"
compute = "real"
link = "real"
clock = "real"
ephemeris = "real"
host = "jetson_aarch64"
