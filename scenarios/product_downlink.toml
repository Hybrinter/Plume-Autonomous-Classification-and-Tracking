name = "product_downlink"
profile = "sil-link-real"
steps = 24
dt = 1.0

# Commission SAFE then OPERATE so the payload stores mask thumbnails. The core downlink
# manager prioritizes and AOS-gates them. iss_iface transmits over the real CCSDS link.

[scene]
num_frames = 24
seed = 0

[[commands]]
at_frame = 1
command_id = "ENTER_INIT"
params = { phase = "ARM" }
source = "ground"
seq = 1

[[commands]]
at_frame = 2
command_id = "ENTER_INIT"
params = { phase = "EXECUTE" }
source = "ground"
seq = 2

[[commands]]
at_frame = 16
command_id = "ENTER_OPERATE"
source = "ground"
seq = 3

[[assertions]]
id = "product_downlink.downlinked"
kind = "min_downlink_count"
value = 1
tag = "frame-portable"

[[assertions]]
id = "product_downlink.ran"
kind = "min_inference_count"
value = 1
tag = "frame-portable"
