[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-analysis"
version = "0.1.0"
description = "PACT design and performance studies (not flight software)"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]
