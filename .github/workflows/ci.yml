name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check packages scripts analysis
      - name: Ruff format check
        run: uv run ruff format --check packages scripts analysis
      - name: Type check
        run: uv run mypy packages scripts analysis
      - name: Import layering
        run: uv run lint-imports
      - name: VCRM traceability
        run: uv run python scripts/check_vcrm.py
      - name: Documentation mirror
        run: uv run python scripts/check_docs.py --strict
      - name: ADR integrity
        run: uv run python scripts/check_adr.py --strict
      - name: Tests
        # testpaths scope collection to packages/*/tests/. Analysis studies are
        # lint/typechecked but have no pytest tree.
        run: uv run pytest -m "not e2e"

  flight-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Check flight-only install
        run: uv run --no-project python scripts/check_flight_image.py
