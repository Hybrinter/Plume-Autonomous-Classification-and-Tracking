[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-tools"
version = "0.1.0"
description = "PACT engineering tools (experiments, training, analysis, replay)"
requires-python = ">=3.14"
dependencies = [
    "pact-flight",
    "pact-sim",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "typer>=0.27.1",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
# Role extras. export = ONNX serialization and INT8 PTQ.
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]
# data = GeoTIFF readers for the Zenodo corpus preprocess step. Training boxes only;
# the processed .npy pack this produces needs none of it.
data = [
    "rasterio>=1.3",
]

[project.scripts]
pact-tools = "tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]

[[tool.uv.index]]
# CUDA 13.0 wheels for Windows training boxes. Linux torch on PyPI already carries CUDA 13.0;
# the PyPI Windows wheel is CPU-only.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
pact-flight = { workspace = true }
pact-sim = { workspace = true }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
