[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-tools"
version = "0.1.0"
description = "PACT engineering tools (experiments, training, analysis, replay)"
requires-python = ">=3.14"
dependencies = [
    "pact-flight",
    "pact-sim",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
# Role extras. train = torch training stack; export = ONNX serialization.
train = [
    "torch>=2.2",
    "torchvision>=0.17",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[project.scripts]
pact-tools = "tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tools"]

[tool.uv.sources]
pact-flight = { workspace = true }
pact-sim = { workspace = true }
