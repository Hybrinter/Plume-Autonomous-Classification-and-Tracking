# PACT default configuration
# All tunable parameters for every subsystem live here.
# No magic numbers in source code — every threshold must reference this file.
# Loaded once at startup by ops/config_loader.py into typed PactConfig dataclasses.

[controller.vision]
confidence_gate = 0.55
blob_iou_match_threshold = 0.25
min_blob_area_px = 15
queue_depth = 4

[controller.arbiter]
release_persistence_frames = 5
limb_arrival_deg = 0.5
max_observation_age_s = 0.25

[controller.inner]
dt_s = 0.001
rate_fit_n = 7
rate_fit_degree = 2
kp = 200.0
ki = 10000.0
tau_cl_s = 0.010

[controller.outer]
dt_s = 0.020
Kp = 8.0
rewind_sharp_max_s = 2.0

[controller.predictor]
cog_height_m = 2000.0

[controller.residual]
Q_diag = [1.0e-11, 3.0e-8]
q_accel_rad2_s3 = 3.0e-8
R_v = 2.12e-9
P0_diag = [1.0e-3, 1.2e-5]
encoder_variance_rad2 = 1.0e-10
reversal_variance_rad2 = 1.0e-10
reversal_threshold_rad = 1.0e-6
interpolation_span_max_s = 0.020
timing_uncertainty_max_s = 1.0e-4
rewind_horizon_s = 0.10
rewind_snapshots = 8

[controller.position]
K_pos = 4.0
r_max_deg_per_s = 8.0

[controller.integrity]
catchup_max_s = 2.0
freeze_strikes = 50
r_min_rad_s = 0.01745
encoder_rate_ratio = 0.2
# Driver-side command lease. Hardware must independently inhibit on expiry.
command_authority_s = 0.020
feedback_max_age_s = 0.010
# Only classified transient availability faults may use this bounded retry budget.
recovery_max_attempts = 3
recovery_window_s = 1.0
# Provisional braking/feedback margin inside each science boundary.
science_boundary_guard_deg = 0.25

[inference]
segmentor_model_path = "data/models/active_segmentor.onnx"
classifier_model_path = "data/models/active_classifier.onnx"
segmentor_rollback_model_path = "data/models/rollback_segmentor.onnx"
classifier_rollback_model_path = "data/models/rollback_classifier.onnx"
classifier_logit_threshold = 0.0
input_bands = ["BLUE", "GREEN", "RED"]
input_height_px = 1544
input_width_px = 2064
use_int8 = false
# Derived expected detect wall (Orin Nano Super, mixed knee: cls FP16 + seg INT8).
latency_budget_ms = 4.0

[comms]
max_downlink_rate_bps = 5000000
max_uplink_rate_bps = 2000000
max_daily_downlink_bytes = 1073741824   # 1 GB
max_daily_uplink_bytes = 104857600      # 100 MB
comm_window_days = ["MON", "TUE", "WED", "THU", "FRI"]
ccsds_apid = 1
staged_segmentor_model_path = "data/models/staged_segmentor.onnx"
staged_classifier_model_path = "data/models/staged_classifier.onnx"
downlink_max_bytes_per_pass = 1048576

[storage]
data_root = "data/flight"
max_storage_bytes = 107374182400   # 100 GB placeholder
checksum_algorithm = "sha256"

[preprocessing]
saturation_fraction_threshold = 0.05
max_motion_smear_px = 1.0

[sensor]
# JAI AP-3200T-USB, Sony IMX265, 3-CMOS prism. width is lateral; height is along-track.
part_number = "AP-3200T-USB"
sensor_name = "Sony IMX265"
width_px = 2064
height_px = 1544
bit_depth = 12
# Wire order. inference.input_bands reorders to BLUE, GREEN, RED.
channel_layout = ["RED", "GREEN", "BLUE"]
pixel_um = 3.45
calibration_dir = ""

[sensor.optics]
# Edmund Optics TECHSPEC athermal 16-849, 100 mm f/4, C-mount.
# Paraxial nadir GSD at 460 km is 15.87 m (460e3 * 3.45e-6 / 0.1).
part_number = "16-849"
focal_length_mm = 100.0
f_number = 4.0
lens_distortion_pct = 1.21
# degrees(pixel_um * 1e-6 / focal_m), stored to 1e-6 deg.
ifov_band_deg_per_px = 0.001977
# Active-pixel FOV at 100 mm. Lateral 4.077 deg, along-track 3.051 deg.
fov_lateral_deg = 4.077
fov_along_deg = 3.051
# Edmund 1/1.8 in sensor-row HFOV. The lens page's 2.74 um pixel is not this camera.
datasheet_hfov_deg = 4.12

[sensor.capture]
# Datasheet 8-bit maximum is 38.3 Hz. Operational cap stays 35 Hz.
max_frame_rate_hz = 35.0
# 8-bit timed range. 12-bit limits are not on the sheet.
exposure_min_us = 30.73
exposure_max_us = 8000000.0
initial_exposure_us = 30.73
# ALC gain span.
gain_min_db = 0.0
gain_max_db = 12.0
initial_gain_db = 0.0
# Imaging duty. 0.5 stretches storage fill from about 2-4 months to about 6 months.
# Not gimbal.xeryon.hv_duty_fraction (the vacuum-variant stage duty).
duty_cycle = 0.5

[fault]
watchdog_interval_s = 5.0
watchdog_max_miss_count = 3
# Derived FDIR detect timeout (5x expected, Orin Nano Super mixed knee).
inference_timeout_ms = 20.0
# Compute target is the Jetson Orin Nano Super Developer Kit, not a bare module.
# Payload-bus FDIR allocation. Orin Nano Super module TDP is 25 W; this is not module TDP.
power_limit_w = 55.0

[thermal]
# Record-only datasheet limits. Housekeeping does not compare until per-component sensors exist.
# AP-3200T-USB operating range.
camera_min_c = -5.0
camera_max_c = 45.0
lens_min_c = -10.0
lens_max_c = 50.0
# XRT-U operating range.
gimbal_min_c = -30.0
gimbal_max_c = 70.0
compute_min_c = 0.0
compute_max_c = 80.0

[gimbal]
# Elevation is signed off-nadir, deg: 0 = geocentric nadir, + along-track (velocity).
# Hard stops are nadir and the flat pose. The mechanism has no look-back travel.
el_hw_min_deg = 0.0
el_hw_max_deg = 90.0
# Science window upper edge stays +45 deg pending further analysis. Lower edge is +5 deg.
el_science_min_deg = 5.0
el_science_max_deg = 45.0
max_hw_slew_rate_deg_per_s = 10.0
# Flat launch pose. A velcro strap wraps the imaging system for stability and load sharing.
stow_el_deg = 90.0
home_el_deg = 45.0
[gimbal.simulation]
# Unmeasured assembly inertia, clamped to the XRT-U-60 payload limit (2500 kg·mm²).
J_kg_m2 = 0.0025
B_nms_per_rad = 0.04
# Minimum driving torque of the XRT-U-60.
tau_max_nm = 0.09
# Unmeasured. Kept at 5% of tau_max, the same fraction as the previous 1 N·m placeholder.
tau_coulomb_nm = 0.0045
# Exact counts/rev for the -60 at encoder option 109 (the -40 option is 86400).
encoder_counts_per_rev = 64800
encoder_noise_deg = 0.00625
seed = 0

[gimbal.xeryon]
# XRT-U-60, encoder option 109 µrad. -HV is vacuum compatibility (1e-6 mbar).
model = "XRT-U-60-109-HV"
controller = "XD-C"
controller_counts_per_rev = 64800
effective_encoder_resolution_urad = 109.0
min_incremental_motion_urad = 125.0
repeatability_uni_urad = 125.0
repeatability_bi_urad = 250.0
wobble_urad = 250.0
# XRT-U-60 payload inertia limit, 2500 kg·mm².
payload_inertia_limit_kg_m2 = 0.0025
command_quantum_deg_per_s = 0.01
rated_speed_limit_deg_per_s = 360.0
software_tracking_limit_deg_per_s = 10.0
encoder_variance_rad2 = 1.0e-10
reversal_variance_rad2 = 1.0e-10
feedback_max_age_s = 0.010
interpolation_span_max_s = 0.020
timing_uncertainty_max_s = 1.0e-4
# Vacuum-variant duty (50% and 120 s). Distinct from imaging duty.
hv_max_on_s = 120.0
hv_duty_fraction = 0.5
stow_reference_rate_deg_per_s = 1.0
stow_timeout_s = 30.0
serial_port = ""
settings_file_path = ""
transport = "usb"
usb_baudrate = 115200
jetson_uart_baudrate = 76800
feedback_info_level = 4
feedback_poll_interval_ms = 2.0
vendor_module = "Xeryon"
# Vendored Stage.XRTU_60_109 uses 64800 counts/rev. Motion stays disabled until the audits below.
vendor_stage = "XRTU_60_109"
axis_letter = "X"
motion_enabled = false
vendor_license_audited = false
python314_audited = false
watchdog_validated = false
stow_bench_validated = false
external_watchdog_required = true

[ephemeris]
# Circular Keplerian ECI stand-in (ISS GP TLE 25544 mean elements, epoch 2026-09-01).
inclination_deg = 51.6312
mean_motion_rev_per_day = 15.48958602
mu_m3_s2 = 3.986004418e14
omega_earth_rad_s = 7.2921159e-5
wgs84_a_m = 6378137.0
wgs84_f = 0.0033528106647474805
epoch_utc_s = 1788249600.0

[link]
command_tcp_host = "127.0.0.1"
command_tcp_port = 50501
telemetry_udp_host = "127.0.0.1"
telemetry_udp_port = 50502
socket_timeout_s = 1.0
tc_apid = 1
tm_apid = 2

[command_ingress]
hmac_key_path = "data/keys/uplink_hmac.key"
require_auth = true
accepted_sources = ["ground", "station_ops"]

[command_router]
arm_window_s = 30.0

[drivers]
# Jetson Orin Nano Super Developer Kit (the kit, not a bare module).
sensor = "real"
gimbal = "real"
compute = "real"
link = "real"
clock = "real"
ephemeris = "real"
host = "jetson_aarch64"
