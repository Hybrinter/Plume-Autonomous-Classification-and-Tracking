[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-xeryon-vendor"
version = "1.88.0"
description = "Vendored Xeryon Python Library v1.88 for the PACT gimbal"
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xeryon_vendor"]
