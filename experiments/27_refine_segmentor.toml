# Stage 2.7: second-tier hyperparameters, on the selected segmentor.
#
# Set `arch` to the architecture chosen at the knee in stage 2, and copy the
# optimizer, learning rate and objective from the stage 2 held recipe. As with
# the classifier, these axes run after architecture selection because their
# best values depend on the capacity they are regularising.
#
# Batch size is an axis here and not for the classifier. The segmentor corpus is
# 1,437 images, so a batch of 32 leaves only about 35 optimizer steps in an
# epoch; batch size therefore changes the number of updates as much as it
# changes gradient noise, and the two effects cannot be assumed to cancel.
#
# `pos_weight` raises the weight of plume pixels inside the BCE term. Median
# plume coverage is under one percent, so the correction is large; 32.0 is
# included as well as 8.0 because the right size of it is not obvious at that
# imbalance, and the Dice part of a combined objective already supplies some of
# the same pressure.
#
# 3 batch sizes x 3 positive weights x 2 weight decays = 18 trials.

kind = "segmentor"
arch = "dilatenet_w32"
data_dir = "data/processed/segmentor"
run_dir = "artifacts/runs"

input_height_px = 128
input_width_px = 128
in_channels = 4

epochs = 120
patience = 20
eval_interval = 1

batch_size = [8, 16, 32]
pos_weight = [0.0, 8.0, 32.0]
weight_decay = [0.0, 0.0001]

optimizer = "adamw"
learning_rate = 0.001
loss = "focal_dice"
momentum = 0.9
scheduler = "cosine"
shuffle = true
augment = true
amp = true
seed = 0
val_metric = "mean_iou"
